apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: My workflow
on:
  push:
    branches:
      - "**"
  workflow_dispatch:
    inputs:
      text:
        type: string
        default: world
        required: true
        description: Text input to say hello
jobs:
  build:
    steps:
      - name: Say hello
        uses: docker://golang:1.20.3-alpine3.17
        shell: sh
        env:
          INPUT_TEXT: "${{ inputs.text }}" # Pass the input as an environment variable
        run: |
          echo "hello $INPUT_TEXT"