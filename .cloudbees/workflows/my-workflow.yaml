apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: My workflow
on:
  push:
    branches:
      - "**"
  workflow_dispatch:
    inputs:
      text:
        type: string
        default: world
        required: true
        description: Text input to say hello
jobs:
  hello-world-job:
    steps:
      - name: Say hello
        uses: ./hello-world
        with:
          name: "${{ inputs.text }}"