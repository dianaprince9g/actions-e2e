action.yml:
---
apiVersion: automation.cloudbees.io/v1alpha1
kind: action
name: Dispatch Workflows
description: Dispatch workflows for specified org and component
inputs:
  orgComponentData:
    description: JSON object with org and component details
    required: true
    default: '{}'

runs:
  using: composite
  steps:
    - name: Parse and Dispatch
      id: parse-and-dispatch
      uses: docker://alpine:3.18
      shell: sh
      run: |
        echo "Received JSON: ${{ inputs.orgComponentData }}"
        echo '${{ inputs.orgComponentData }}' > org-component.json
        cat org-component.json
        jq -c '.[]' org-component.json | while read entry; do
          org=$(echo "$entry" | jq -r '.org')
          component=$(echo "$entry" | jq -r '.component')
          echo "Dispatching for Org: $org, Component: $component"
          # Add dispatch logic here
        done