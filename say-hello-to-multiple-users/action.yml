---
apiVersion: automation.cloudbees.io/v1alpha1
kind: action
name: Hello World
description: Prints greeting messages for the given names
inputs:
  names:
    description: A comma-separated list of names to greet
    required: true
    default: "World"

runs:
  using: composite
  steps:
    - name: Greet the users
      id: greet-users
      uses: docker://alpine:3.18
      shell: sh
      run: |
        if [ -z "${{ inputs.names }}" ]; then
          echo "No names provided to greet."
          exit 1
        fi

        for name in $(echo "${{ inputs.names }}" | tr ',' '\n'); do
          echo "Hello $name!"
        done